controllers:
  prowlarr:
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: latest
        env:
          TZ: Europe/Amsterdam
          PUID: "1000"
          PGID: "100"

service:
  app:
    controller: prowlarr
    ports:
      http:
        port: 9696

ingress:
  app:
    enabled: true
    className: traefik
    hosts:
      - host: prowlarr.thuis
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /config
